<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>A to Z Flash Cards</title>
<style>
  :root {
    --bg1: #ffe29f;
    --bg2: #ffa99f;
    --accent: #ff6b6b;
    --card: #ffffff;
    --ink: #2b2b3c;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 20px;
    background: linear-gradient(135deg, var(--bg1), var(--bg2));
    background-size: 200% 200%;
    animation: bgShift 14s ease infinite;
    color: var(--ink);
    transition: background 0.6s ease;
    overflow: hidden;
    user-select: none;
  }

  @keyframes bgShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  h1 {
    font-size: clamp(1rem, 2.5vw, 1.35rem);
    font-weight: 600;
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: 0.75;
  }

  /* ---------- card ---------- */
  .stage {
    perspective: 1200px;
    width: min(92vw, 420px);
    height: min(62vh, 430px);
  }

  .card {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.55s cubic-bezier(.2,.8,.2,1);
    cursor: pointer;
  }

  .card.flipped { transform: rotateY(180deg); }

  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    background: var(--card);
    border-radius: 28px;
    box-shadow: 0 22px 45px rgba(0,0,0,0.22);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 24px;
    text-align: center;
  }

  .face.back { transform: rotateY(180deg); }

  .emoji {
    font-size: clamp(78px, 20vw, 132px);
    line-height: 1;
    filter: drop-shadow(0 8px 10px rgba(0,0,0,0.16));
    animation: pop 0.45s ease;
  }

  .letters {
    display: flex;
    align-items: baseline;
    gap: 18px;
    font-weight: 800;
    line-height: 1;
  }

  .cap { font-size: clamp(76px, 20vw, 128px); color: var(--accent); }
  .small { font-size: clamp(44px, 11vw, 72px); color: var(--ink); opacity: 0.85; }

  .word {
    font-size: clamp(1.1rem, 4vw, 1.55rem);
    font-weight: 600;
    letter-spacing: 1px;
    opacity: 0.9;
  }

  .hint {
    position: absolute;
    bottom: 14px;
    font-size: 0.72rem;
    letter-spacing: 1px;
    opacity: 0.35;
    text-transform: uppercase;
  }

  .dots {
    display: flex;
    gap: 7px;
    margin-top: 2px;
  }

  .dots i {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #d9d9e3;
    transition: background 0.25s ease, transform 0.25s ease;
  }

  .dots i.on {
    background: var(--accent);
    transform: scale(1.25);
  }

  .back .letters { flex-direction: column; gap: 2px; }
  .back .cap { color: var(--ink); }
  .back .small { color: var(--accent); }

  @keyframes pop {
    0%   { transform: scale(0.6); opacity: 0; }
    70%  { transform: scale(1.08); }
    100% { transform: scale(1); opacity: 1; }
  }

  .bounce { animation: bounce 0.4s ease; }
  @keyframes bounce {
    0% { transform: scale(1); }
    40% { transform: scale(1.04); }
    100% { transform: scale(1); }
  }

  /* ---------- controls ---------- */
  .controls {
    display: flex;
    align-items: center;
    gap: 22px;
  }

  .arrow {
    width: 62px;
    height: 62px;
    border: none;
    border-radius: 50%;
    background: #fff;
    color: var(--accent);
    font-size: 1.7rem;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 10px 22px rgba(0,0,0,0.2);
    transition: transform 0.15s ease, background 0.2s ease;
    display: grid;
    place-items: center;
  }

  .arrow:hover { transform: translateY(-3px) scale(1.06); background: var(--accent); color: #fff; }
  .arrow:active { transform: scale(0.94); }

  .counter {
    min-width: 96px;
    text-align: center;
    font-size: 1.15rem;
    font-weight: 700;
    background: rgba(255,255,255,0.55);
    padding: 10px 16px;
    border-radius: 999px;
    letter-spacing: 2px;
  }

  .bar {
    width: min(88vw, 420px);
    height: 6px;
    background: rgba(255,255,255,0.45);
    border-radius: 999px;
    overflow: hidden;
  }

  .bar > span {
    display: block;
    height: 100%;
    width: 4%;
    background: #fff;
    border-radius: 999px;
    transition: width 0.35s ease;
  }

  .tools {
    display: flex;
    gap: 10px;
  }

  .chip {
    border: none;
    background: rgba(255,255,255,0.55);
    color: var(--ink);
    padding: 9px 16px;
    border-radius: 999px;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.15s ease;
  }

  .chip:hover { background: #fff; transform: translateY(-2px); }
  .chip.active { background: var(--accent); color: #fff; }

  .tools { flex-wrap: wrap; justify-content: center; }

  /* ---------- voice picker ---------- */
  .voicePanel {
    position: fixed;
    left: 50%;
    bottom: 76px;
    transform: translateX(-50%);
    width: min(92vw, 350px);
    max-height: 48vh;
    background: rgba(255,255,255,0.97);
    border-radius: 22px;
    box-shadow: 0 20px 45px rgba(0,0,0,0.3);
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 9px;
    z-index: 30;
    animation: vpIn 0.18s ease;
  }

  .voicePanel[hidden] { display: none; }

  @keyframes vpIn {
    from { opacity: 0; transform: translateX(-50%) translateY(12px); }
    to   { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  .vpHead {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.92rem;
    font-weight: 700;
    color: var(--ink);
  }

  .vpHead button {
    border: none;
    background: #f0f0f5;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 0.8rem;
    color: var(--ink);
  }

  .vpHead button:hover { background: var(--accent); color: #fff; }

  .vpHint { font-size: 0.7rem; opacity: 0.55; letter-spacing: 0.3px; }

  .vpList {
    list-style: none;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding-right: 4px;
    margin: 0;
  }

  .vpList li {
    padding: 9px 12px;
    border-radius: 13px;
    background: #f4f4f9;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--ink);
    transition: background 0.15s ease, transform 0.12s ease;
  }

  .vpList li:hover { background: #e9e9f4; transform: translateX(3px); }
  .vpList li.on { background: var(--accent); color: #fff; }
  .vpList li.on .lang { color: rgba(255,255,255,0.85); }
  .vpList .lang { font-size: 0.68rem; font-weight: 600; opacity: 0.6; white-space: nowrap; }

  @media (max-height: 620px) {
    .stage { height: min(58vh, 330px); }
    h1 { display: none; }
  }
</style>
</head>
<body>

  <h1>A to Z Flash Cards</h1>

  <div class="stage">
    <div class="card" id="card" title="Click to flip">
      <div class="face front">
        <div class="emoji" id="emoji">🐜</div>
        <div class="letters">
          <span class="cap" id="capFront">A</span>
          <span class="small" id="smallFront">a</span>
        </div>
        <div class="word" id="word">Ant</div>
        <div class="dots" id="dots"></div>
        <div class="hint">tap card to flip</div>
      </div>

      <div class="face back">
        <div class="letters">
          <span class="cap" id="capBack">A</span>
          <span class="small" id="smallBack">a</span>
        </div>
        <div class="word" id="soundWord">"A" for Ant</div>
        <div class="emoji" id="emojiBack" style="font-size: clamp(56px,14vw,92px)">🐜</div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="arrow" id="prev" aria-label="Previous">&#8592;</button>
    <div class="counter" id="counter">A / Z</div>
    <button class="arrow" id="next" aria-label="Next">&#8594;</button>
  </div>

  <div class="bar"><span id="progress"></span></div>

  <div class="tools">
    <button class="chip" id="nextWord">&#128260; Next word</button>
    <button class="chip" id="speak">&#128266; Say it</button>
    <button class="chip" id="voiceBtn" title="Choose a voice">&#127908; <span id="voiceLabel">Voice</span></button>
    <button class="chip" id="random">&#127922; Random</button>
  </div>

  <div class="voicePanel" id="voicePanel" hidden>
    <div class="vpHead">
      <span>&#127908; Choose your voice</span>
      <button id="voiceClose" aria-label="Close">&#10005;</button>
    </div>
    <div class="vpHint">Tap any voice to hear a preview &mdash; your choice is saved.</div>
    <ul class="vpList" id="voiceList"></ul>
  </div>

<script>
  const CARDS = [
    { l: "A", words: [ {w:"Ant",e:"\u{1F41C}"}, {w:"Anchor",e:"\u2693"}, {w:"Axe",e:"\u{1FA93}"} ] },
    { l: "B", words: [ {w:"Bubbles",e:"\u{1FAE7}"}, {w:"Bread",e:"\u{1F35E}"}, {w:"Balloon",e:"\u{1F388}"} ] },
    { l: "C", words: [ {w:"Compass",e:"\u{1F9ED}"}, {w:"Candle",e:"\u{1F56F}"}, {w:"Curling",e:"\u{1F94C}"} ] },
    { l: "D", words: [ {w:"Dinosaur",e:"\u{1F995}"}, {w:"Diamond",e:"\u{1F48E}"}, {w:"Drum",e:"\u{1F941}"} ] },
    { l: "E", words: [ {w:"Eagle",e:"\u{1F985}"}, {w:"Eggplant",e:"\u{1F346}"}, {w:"Envelope",e:"\u2709"} ] },
    { l: "F", words: [ {w:"Fox",e:"\u{1F98A}"}, {w:"Feather",e:"\u{1FAB6}"}, {w:"Hand Fan",e:"\u{1FAAD}"} ] },
    { l: "G", words: [ {w:"Giraffe",e:"\u{1F992}"}, {w:"Grapes",e:"\u{1F347}"}, {w:"Guitar",e:"\u{1F3B8}"} ] },
    { l: "H", words: [ {w:"Hedgehog",e:"\u{1F994}"}, {w:"Hammer",e:"\u{1F528}"}, {w:"Helmet",e:"\u26D4"} ] },
    { l: "I", words: [ {w:"Ice Cube",e:"\u{1F9CA}"}, {w:"Island",e:"\u{1F3DD}"}, {w:"Ink",e:"\u{1F58B}"} ] },
    { l: "J", words: [ {w:"Jar",e:"\u{1FAD9}"}, {w:"Jellyfish",e:"\u{1FABC}"}, {w:"Juice",e:"\u{1F9C3}"} ] },
    { l: "K", words: [ {w:"Kangaroo",e:"\u{1F998}"}, {w:"Kite",e:"\u{1FA81}"}, {w:"Key",e:"\u{1F511}"} ] },
    { l: "L", words: [ {w:"Lion",e:"\u{1F981}"}, {w:"Ladder",e:"\u{1FA9E}"}, {w:"Lamp",e:"\u{1F4A1}"} ] },
    { l: "M", words: [ {w:"Mushroom",e:"\u{1F344}"}, {w:"Magnet",e:"\u{1F9F2}"}, {w:"Moon",e:"\u{1F319}"} ] },
    { l: "N", words: [ {w:"Nest",e:"\u{1FABA}"}, {w:"Needle",e:"\u{1FAA1}"}, {w:"Notebook",e:"\u{1F4D3}"} ] },
    { l: "O", words: [ {w:"Octopus",e:"\u{1F419}"}, {w:"Orange",e:"\u{1F34A}"}, {w:"Olive",e:"\u{1FAD2}"} ] },
    { l: "P", words: [ {w:"Penguin",e:"\u{1F427}"}, {w:"Pizza",e:"\u{1F355}"}, {w:"Piano",e:"\u{1F3B9}"} ] },
    { l: "Q", words: [ {w:"Queen",e:"\u{1F478}"}, {w:"Question",e:"\u2753"}, {w:"Quiet",e:"\u{1F92B}"} ] },
    { l: "R", words: [ {w:"Rainbow",e:"\u{1F308}"}, {w:"Rocket",e:"\u{1F680}"}, {w:"Ruler",e:"\u{1F4CF}"} ] },
    { l: "S", words: [ {w:"Snake",e:"\u{1F40D}"}, {w:"Star",e:"\u2B50"}, {w:"Spoon",e:"\u{1F944}"} ] },
    { l: "T", words: [ {w:"Turtle",e:"\u{1F422}"}, {w:"Telescope",e:"\u{1F52D}"}, {w:"Tent",e:"\u26FA"} ] },
    { l: "U", words: [ {w:"Unicorn",e:"\u{1F984}"}, {w:"Umbrella",e:"\u2602"}, {w:"UFO",e:"\u{1F6F8}"} ] },
    { l: "V", words: [ {w:"Volcano",e:"\u{1F30B}"}, {w:"Violin",e:"\u{1F3BB}"}, {w:"Van",e:"\u{1F690}"} ] },
    { l: "W", words: [ {w:"Whale",e:"\u{1F40B}"}, {w:"Watch",e:"\u231A"}, {w:"Window",e:"\u{1FA9F}"} ] },
    { l: "X", words: [ {w:"X-Ray",e:"\u{1FA7B}"}, {w:"Xylophone",e:"\u{1F3BC}"}, {w:"X-mas Tree",e:"\u{1F384}"} ] },
    { l: "Y", words: [ {w:"Yo-Yo",e:"\u{1F380}"}, {w:"Yacht",e:"\u26F5"}, {w:"Yarn",e:"\u{1F9F6}"} ] },
    { l: "Z", words: [ {w:"Zebra",e:"\u{1F993}"}, {w:"Zipper",e:"\u{1F90F}"}, {w:"Zero",e:"0\uFE0F\u20E3"} ] }
  ];

  const THEMES = [
    ["#ffe29f", "#ffa99f", "#ff6b6b"],
    ["#a1c4fd", "#c2e9fb", "#3f8efc"],
    ["#84fab0", "#8fd3f4", "#12b886"],
    ["#fddb92", "#d1fdff", "#f7797d"],
    ["#e0c3fc", "#8ec5fc", "#9b5de5"],
    ["#f6d365", "#fda085", "#ff7e5f"],
    ["#d4fc79", "#96e6a1", "#37b24d"],
    ["#fbc2eb", "#a6c1ee", "#e55039"]
  ];

  const card     = document.getElementById("card");
  const emojiEl  = document.getElementById("emoji");
  const emojiBk  = document.getElementById("emojiBack");
  const capF     = document.getElementById("capFront");
  const smallF   = document.getElementById("smallFront");
  const capB     = document.getElementById("capBack");
  const smallB   = document.getElementById("smallBack");
  const wordEl   = document.getElementById("word");
  const soundW   = document.getElementById("soundWord");
  const counter  = document.getElementById("counter");
  const progress = document.getElementById("progress");
  const dotsEl   = document.getElementById("dots");

  let i  = 0;   // letter index
  let wi = 0;   // word index for current letter

  function render() {
    const c = CARDS[i];
    const d = c.words[wi];
    const t = THEMES[i % THEMES.length];

    emojiEl.textContent = d.e;
    emojiBk.textContent = d.e;
    capF.textContent    = c.l;
    smallF.textContent  = c.l.toLowerCase();
    capB.textContent    = c.l;
    smallB.textContent  = c.l.toLowerCase();
    wordEl.textContent  = d.w;
    soundW.textContent  = c.l + " \u201C" + c.l + "\u201D for " + d.w;
    counter.textContent = c.l + " / Z";
    progress.style.width = ((i + 1) / CARDS.length * 100) + "%";

    // word indicator dots (one per word for this letter)
    dotsEl.innerHTML = c.words.map((_, k) =>
      '<i class="' + (k === wi ? "on" : "") + '"></i>'
    ).join("");

    document.documentElement.style.setProperty("--bg1", t[0]);
    document.documentElement.style.setProperty("--bg2", t[1]);
    document.documentElement.style.setProperty("--accent", t[2]);

    // restart pop animation
    emojiEl.style.animation = "none";
    void emojiEl.offsetWidth;
    emojiEl.style.animation = "";
  }

  function go(step) {
    i = (i + step + CARDS.length) % CARDS.length;
    wi = 0;
    card.classList.remove("flipped");
    card.classList.add("bounce");
    setTimeout(() => card.classList.remove("bounce"), 400);
    setTimeout(render, 120);
  }

  function nextWord() {
    const c = CARDS[i];
    wi = (wi + 1) % c.words.length;
    card.classList.add("bounce");
    setTimeout(() => card.classList.remove("bounce"), 400);
    render();
  }

  document.getElementById("next").onclick = () => go(1);
  document.getElementById("prev").onclick = () => go(-1);
  card.onclick = () => card.classList.toggle("flipped");

  document.getElementById("nextWord").onclick = nextWord;

  document.getElementById("random").onclick = () => {
    let n;
    do { n = Math.floor(Math.random() * CARDS.length); } while (n === i);
    i = n;
    wi = Math.floor(Math.random() * CARDS[n].words.length);
    card.classList.remove("flipped");
    render();
  };

  /* ---------------- voice assistant ---------------- */
  const synth = window.speechSynthesis || null;
  const BASE = { rate: 0.92, pitch: 1.05 };
  let VOICES = [];
  let chosenVoice = "";
  let speakToken = 0;

  try { chosenVoice = localStorage.getItem("az.voice") || ""; } catch (e) {}

  // rank voices: English first, then the ones that actually sound human
  function scoreVoice(v) {
    const n = (v.name || "").toLowerCase();
    const lang = (v.lang || "").toLowerCase();
    let s = lang.indexOf("en") === 0 ? 100 : -100;
    if (lang === "en-us" || lang === "en-gb" || lang === "en-in") s += 10;
    if (/natural|neural|premium|enhanced|online|google|aria|jenny|guy|ava|andrew|emma|ryan|samantha|karen|moira|serena|libby/.test(n)) s += 40;
    if (/zira|david|hazel|mark|compact|desktop|espeak|robot|unitron|fred|heami/.test(n)) s -= 30;
    if (v.localService === false) s += 15;   // cloud voices are usually smoother
    if (v.default) s += 5;
    return s;
  }

  function refreshVoices() {
    if (!synth) return;
    const list = synth.getVoices() || [];
    if (!list.length) return;
    VOICES = Array.from(list).sort((a, b) => scoreVoice(b) - scoreVoice(a));
    buildVoiceList();
  }

  function activeVoice() {
    if (!VOICES.length) return null;
    const saved = VOICES.find(v => v.voiceURI === chosenVoice);
    if (saved) return saved;
    return VOICES.find(v => (v.lang || "").toLowerCase().indexOf("en") === 0) || VOICES[0];
  }

  // speaks each chunk separately with a breathing pause -> feels human, not robotic
  function speakParts(parts, gap) {
    if (!synth) return;
    synth.cancel();
    const token = ++speakToken;
    let k = 0;
    const step = () => {
      if (token !== speakToken || k >= parts.length) return;
      const p = parts[k++];
      const u = new SpeechSynthesisUtterance(p.text);
      const v = activeVoice();
      if (v) u.voice = v;
      u.lang = (v && v.lang) || "en-US";
      u.rate = p.rate != null ? p.rate : BASE.rate;
      u.pitch = p.pitch != null ? p.pitch : BASE.pitch;
      u.volume = 1;
      u.onend = () => setTimeout(step, gap);
      u.onerror = () => setTimeout(step, gap);
      synth.speak(u);
    };
    setTimeout(step, 90);  // Chrome drops speech if you speak right after cancel()
  }

  function sayCard() {
    const c = CARDS[i];
    const d = c.words[wi];
    const wob = (Math.random() - 0.5) * 0.12;   // tiny pitch wobble = not machine-like
    speakParts([
      { text: c.l + ".",                    rate: 0.75, pitch: 1.20 + wob },
      { text: c.l + " for " + d.w + "!",    rate: 0.90, pitch: 1.03 + wob }
    ], 320);
  }

  const voiceBtn   = document.getElementById("voiceBtn");
  const voicePanel = document.getElementById("voicePanel");
  const voiceList  = document.getElementById("voiceList");
  const voiceLabel = document.getElementById("voiceLabel");

  const esc = s => String(s).replace(/[&<>"']/g, m =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));

  function buildVoiceList() {
    if (!voiceList) return;
    const cur = activeVoice();
    const auto = '<li data-uri="" class="' + (chosenVoice ? "" : "on") + '">' +
                 '<span>&#10024; Auto &mdash; best voice</span><span class="lang">auto</span></li>';
    const items = VOICES.map(v => {
      const on = cur && v.voiceURI === cur.voiceURI;
      return '<li data-uri="' + esc(v.voiceURI) + '" class="' + (on ? "on" : "") + '">' +
             "<span>" + esc(v.name) + '</span><span class="lang">' + esc(v.lang) + "</span></li>";
    }).join("");
    voiceList.innerHTML = auto + items;
    updateVoiceLabel();
  }

  function updateVoiceLabel() {
    const v = activeVoice();
    if (!voiceLabel) return;
    if (!v) { voiceLabel.textContent = "Voice"; return; }
    let n = v.name.replace(/^(Microsoft|Google|Apple)\s+/i, "").split(/[ (]/)[0];
    if (n.length > 11) n = n.slice(0, 10) + "\u2026";
    voiceLabel.textContent = n;
    voiceBtn.title = "Voice: " + v.name + " (" + v.lang + ")";
  }

  if (synth) {
    synth.onvoiceschanged = refreshVoices;
    refreshVoices();
    setTimeout(refreshVoices, 400);    // some browsers load voices late
    setTimeout(refreshVoices, 1500);
  }

  document.getElementById("speak").onclick = sayCard;

  voiceBtn.onclick = () => {
    voicePanel.hidden = !voicePanel.hidden;
    voiceBtn.classList.toggle("active", !voicePanel.hidden);
  };

  document.getElementById("voiceClose").onclick = () => {
    voicePanel.hidden = true;
    voiceBtn.classList.remove("active");
  };

  voiceList.onclick = (e) => {
    const li = e.target.closest("li");
    if (!li) return;
    chosenVoice = li.dataset.uri || "";
    try { localStorage.setItem("az.voice", chosenVoice); } catch (err) {}
    buildVoiceList();
    // preview so the change is heard immediately
    speakParts([{ text: "Hello! I am your A to Z friend.", rate: 0.92, pitch: 1.12 }], 120);
  };

  document.addEventListener("pointerdown", (e) => {
    if (voicePanel.hidden) return;
    if (!voicePanel.contains(e.target) && !voiceBtn.contains(e.target)) {
      voicePanel.hidden = true;
      voiceBtn.classList.remove("active");
    }
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") go(1);
    if (e.key === "ArrowLeft")  go(-1);
    if (e.key === "ArrowDown" || e.key === "n" || e.key === "N") nextWord();
    if (e.key === " ") { e.preventDefault(); card.classList.toggle("flipped"); }
  });

  // swipe support for mobile
  let startX = null;
  document.addEventListener("touchstart", (e) => { startX = e.touches[0].clientX; }, { passive: true });
  document.addEventListener("touchend", (e) => {
    if (startX === null) return;
    const dx = e.changedTouches[0].clientX - startX;
    if (Math.abs(dx) > 50) go(dx < 0 ? 1 : -1);
    startX = null;
  }, { passive: true });

  render();
</script>
</body>
</html>
